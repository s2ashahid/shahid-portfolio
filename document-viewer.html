<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Document Viewer | Shahid Syed Ali</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080a0b;color:#f4f4ef;font-family:Arial,sans-serif}body{display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #292e30;background:#0d1011}.brand{font-weight:700;letter-spacing:.08em}.brand span{color:#d8ff4d}.title{font-size:13px;color:#c8cdce}.hint{font-size:11px;color:#777e81}main{flex:1;padding:10px}.viewer{width:100%;height:100%;border:1px solid #292e30;background:#fff}iframe{width:100%;height:100%;border:0}@media(max-width:700px){.hint{display:none}.top{height:50px}.title{font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="brand">SHAHID<span>.</span></div><div class="title" id="title">Document</div><div class="hint">View only · use your browser's PDF controls if you need a copy</div></header>
<main><div class="viewer"><iframe id="pdf" title="PDF document"></iframe></div></main>
<script>
const params=new URLSearchParams(location.search);
const file=params.get('file');
const title=params.get('title')||'Document';
document.title=title+' | Shahid Syed Ali';
document.getElementById('title').textContent=title;
if(file){document.getElementById('pdf').src=decodeURIComponent(file)+'#view=FitH';}
else{document.getElementById('pdf').src='about:blank';}
</script>
</body>
</html>
